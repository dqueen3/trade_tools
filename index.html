<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>📈 HyperSBI — Live Market Stream</title>
<meta http-equiv="refresh" content="60"> <!-- 🔥 毎60秒自動更新 -->
<style>
    body { background:#0A0A0A; color:#EAEAEA; font-family:monospace; text-align:center; }
    .img-new { width:95%; border:3px solid #00B4FF; margin:14px auto; box-shadow:0 0 20px #00B4FF66; }
    .img-old { width:75%; opacity:.4; margin:10px auto; filter:grayscale(30%); }
</style>
</head>
<body>
<h1>📊 Market Stream — Latest First</h1>

<script>
(async()=>{
    const repo = "dqueen3/trade_tools";
    const path = "stocks";
    const res = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`);
    const files = await res.json();
    const sorted = files.filter(f => f.name.endsWith(".png"))
                        .sort((a,b)=>b.name.localeCompare(a.name));

    document.body.innerHTML += 
        `<img class="img-new" src="${sorted[0].download_url}">` + 
        sorted.slice(1,10).map(f=>`<img class="img-old" src="${f.download_url}">`).join("");
})();
</script>
</body>
</html>
